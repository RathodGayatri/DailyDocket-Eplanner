<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Plan | E-Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same styles as exam_list.html */
        :root {
            --primary-bg: #1e1e2f;
            --card-bg: #2a2d3e;
            --text-color: #ffffff;
            --highlight: #ff5e62;
        }
        
        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
        }
        
        .subject-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid;
        }
        
        .session-log {
            background: rgba(58, 63, 88, 0.5);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2><i class="fas fa-tasks me-2"></i>Study Plan</h2>
                <h4 class="text-muted">Mathematics Final - May 15</h4>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
                <i class="fas fa-plus me-2"></i>Add Subject
            </button>
        </div>
        
        <!-- Progress Summary -->
        <div class="card bg-dark mb-4">
            <div class="card-body">
                <h5 class="card-title">Overall Progress</h5>
                <div class="progress mb-2" style="height: 10px;">
                    <div class="progress-bar bg-success" style="width: 45%"></div>
                </div>
                <div class="d-flex justify-content-between">
                    <small>15/30 hours completed</small>
                    <small>15 hours remaining</small>
                </div>
            </div>
        </div>
        
        <!-- Subjects -->
        <div class="mb-4">
            <h5 class="mb-3"><i class="fas fa-book me-2"></i>Subjects</h5>
            
            <div class="subject-card" style="border-color: #3498db;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6>Algebra</h6>
                        <div class="progress mb-2" style="height: 5px; width: 200px;">
                            <div class="progress-bar" style="width: 60%"></div>
                        </div>
                        <small>6/10 hours (60%)</small>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#logSessionModal">
                            <i class="fas fa-plus me-1"></i> Log Session
                        </button>
                        <button class="btn btn-sm btn-outline-danger">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Session Logs -->
                <div class="mt-3">
                    <h6 class="text-muted mb-2">Recent Sessions</h6>
                    <div class="session-log">
                        <div class="d-flex justify-content-between">
                            <span>May 5, 2023</span>
                            <span class="fw-bold">2 hours</span>
                        </div>
                        <p class="mb-0 mt-1">Reviewed quadratic equations</p>
                    </div>
                    <div class="session-log">
                        <div class="d-flex justify-content-between">
                            <span>May 2, 2023</span>
                            <span class="fw-bold">1.5 hours</span>
                        </div>
                        <p class="mb-0 mt-1">Practiced problem sets</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal fade" id="addSubjectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title">Add Study Subject</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Subject Name</label>
                            <input type="text" class="form-control bg-secondary text-white" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Color</label>
                            <input type="color" class="form-control form-control-color" value="#3498db" title="Choose color">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hours Planned</label>
                            <input type="number" class="form-control bg-secondary text-white" min="1" value="5">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Add Subject</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Log Session Modal -->
    <div class="modal fade" id="logSessionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title">Log Study Session</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control bg-secondary text-white" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Duration (hours)</label>
                            <input type="number" step="0.5" min="0.5" max="8" class="form-control bg-secondary text-white" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control bg-secondary text-white" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Log Session</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
