    <script>
        // Send time data to server when page closes/refreshes
window.addEventListener('beforeunload', async () => {
    const tasks = document.querySelectorAll('.time-tracker');
    for (const tracker of tasks) {
        const taskName = tracker.dataset.task;
        const timeSpent = parseInt(localStorage.getItem(`time_${taskName}`)) || 0;
        
        if (timeSpent > 0) {
            await fetch('/update_time_log/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}',
                },
                body: JSON.stringify({
                    task_name: taskName,
                    duration_seconds: timeSpent,
                }),
            });
            localStorage.removeItem(`time_${taskName}`);  // Reset after saving
        }
    }
});
    </script>
