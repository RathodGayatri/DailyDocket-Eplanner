<div class="modal fade" id="timeLogsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" style="background-color: #1f314b; color: white;">
            <div class="modal-header">
                <h5 class="modal-title">Time Tracking Summary</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table class="table table-dark">
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Time Spent</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <!-- Filled by JavaScript -->
                    </tbody>
                </table>
                <button id="exportLogsBtn" class="btn btn-sm btn-success mt-3">Export as CSV</button>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    
// Time Tracker Logic
document.addEventListener('DOMContentLoaded', function() {
    const trackers = document.querySelectorAll('.time-tracker');

    trackers.forEach(tracker => {
        const startBtn = tracker.querySelector('.start-btn');
        const stopBtn = tracker.querySelector('.stop-btn');
        const timeDisplay = tracker.querySelector('.time-display');
        const taskName = tracker.dataset.task;

        let startTime;
        let totalTime = parseInt(localStorage.getItem(`time_${taskName}`)) || 0;

        // Load saved time
        timeDisplay.textContent = formatTime(totalTime);

        startBtn.addEventListener('click', () => {
            startTime = new Date();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            if (!startTime) return;

            const endTime = new Date();
            const timeSpent = Math.floor((endTime - startTime) / 1000); // in seconds
            totalTime += timeSpent;

            timeDisplay.textContent = formatTime(totalTime);
            localStorage.setItem(`time_${taskName}`, totalTime);

            startBtn.disabled = false;
            stopBtn.disabled = true;
            startTime = null;
        });
    });

    function formatTime(seconds) {
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        return `${hrs}h ${mins}m ${secs}s`;
    }
});

// Summary Modal Logic
document.getElementById('viewLogsBtn').addEventListener('click', () => {
    const modal = new bootstrap.Modal(document.getElementById('timeLogsModal'));
    updateLogsTable();
    modal.show();
});

function updateLogsTable() {
    const tbody = document.getElementById('logsTableBody');
    tbody.innerHTML = '';
    let totalTime = 0;

    document.querySelectorAll('.time-tracker').forEach(tracker => {
        const taskName = tracker.dataset.task;
        const timeSpent = parseInt(localStorage.getItem(`time_${taskName}`)) || 0;
        totalTime += timeSpent;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${taskName}</td>
            <td>${formatTime(timeSpent)}</td>
            <td><button class="btn btn-sm btn-warning reset-btn" data-task="${taskName}">Reset</button></td>
        `;
        tbody.appendChild(row);
    });

    // Add total row
    const totalRow = document.createElement('tr');
    totalRow.innerHTML = `
        <td><strong>Total</strong></td>
        <td><strong>${formatTime(totalTime)}</strong></td>
        <td></td>
    `;
    tbody.appendChild(totalRow);

    // Add reset all button
    const resetAllRow = document.createElement('tr');
    resetAllRow.innerHTML = `
        <td colspan="3" class="text-center">
            <button id="resetAllBtn" class="btn btn-sm btn-danger">Reset All Logs</button>
        </td>
    `;
    tbody.appendChild(resetAllRow);

    // Attach reset handlers
    document.querySelectorAll('.reset-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const task = e.target.dataset.task;
            localStorage.removeItem(`time_${task}`);
            updateLogsTable();
            document.querySelector(`.time-tracker[data-task="${task}"] .time-display`).textContent = '0h 0m 0s';
        });
    });

    document.getElementById('resetAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.time-tracker').forEach(tracker => {
            const taskName = tracker.dataset.task;
            localStorage.removeItem(`time_${taskName}`);
            tracker.querySelector('.time-display').textContent = '0h 0m 0s';
        });
        updateLogsTable();
    });

    // Export to CSV
    document.getElementById('exportLogsBtn').addEventListener('click', () => {
        let csv = 'Task,Time Spent\n';
        document.querySelectorAll('.time-tracker').forEach(tracker => {
            const taskName = tracker.dataset.task;
            const timeSpent = localStorage.getItem(`time_${taskName}`) || 0;
            csv += `${taskName},${formatTime(timeSpent)}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'time_logs.csv';
        a.click();
    });
}
</script>
