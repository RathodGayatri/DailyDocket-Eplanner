                        var seconds = date.getSeconds().toString().padStart(2, '0');
                        document.querySelector('.clock').innerText = hours + ':' + minutes + ':' + seconds;

                        </div>
                        <div class="col-md-3">
                            <label for="amount" class="form-label">Amount (₹)</label>
                            <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-3">
                            <label for="category" class="form-label">Spending Type</label>
                            <select class="form-control" id="category" required>

                                <option value="Transport">Transport</option>
                                <option value="Shopping">Shopping</option>

                        <tr>
                            <th>Day</th>

                            <th>Amount</th>

                            <th>Action</th>
                        </tr>

                        <!-- Dynamic Content -->
                    </tbody>

                <div class="d-flex justify-content-between">

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const expenseForm = document.getElementById("expense-form");
        const expenseList = document.getElementById("expense-list");
        const weeklyTotalDisplay = document.getElementById("weekly-total");
        const monthlyTotalDisplay = document.getElementById("monthly-total");
        let isSubmitting = false;

        // Set default date to today
        const dateInput = document.getElementById("date");
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        // Load expenses when page loads
        fetchExpenses();

        function fetchExpenses() {
            // Simulate API call - replace with your actual API endpoint
            console.log("Fetching expenses...");
            // This would be your actual fetch call:
            // fetch('/api/expenses/')
            //     .then(response => response.json())
            //     .then(expenses => renderExpenses(expenses));
            
            // For demo purposes, we'll use mock data
            const mockExpenses = [
                { id: 1, day: "Monday", date: today, amount: "150.50", category: "Food" },
                { id: 2, day: "Tuesday", date: today, amount: "75.25", category: "Transport" }
            ];
            renderExpenses(mockExpenses);
        }

        function renderExpenses(expenses) {
            expenseList.innerHTML = "";
            let weeklyTotal = 0;
            let monthlyTotal = 0;

            expenses.forEach((expense) => {
                const amount = parseFloat(expense.amount);
                weeklyTotal += amount;
                monthlyTotal += amount;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${expense.day}</td>
                    <td>${formatDate(expense.date)}</td>
                    <td>₹${amount.toFixed(2)}</td>
                    <td>${expense.category}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteExpense(${expense.id})">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                `;
                expenseList.appendChild(row);
            });

            weeklyTotalDisplay.textContent = weeklyTotal.toFixed(2);
            monthlyTotalDisplay.textContent = monthlyTotal.toFixed(2);
        }

        function formatDate(dateString) {
            if (!dateString) return "N/A";
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return "Invalid Date";
            
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString(undefined, options);
        }

        window.deleteExpense = (id) => {
            if (confirm('Are you sure you want to delete this expense?')) {
                console.log(`Deleting expense with ID: ${id}`);
                // This would be your actual delete API call:

                //     method: 'DELETE',
                //     headers: {
                //         'Content-Type': 'application/json',
                //         'X-CSRFToken': getCookie('csrftoken'),
                //     }
                // })
                // .then(response => {
                //     if (response.ok) fetchExpenses();
                // });
                
                // For demo, just refetch
                fetchExpenses();
            }
        };

        expenseForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            
            isSubmitting = true;
            const submitButton = e.target.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Saving...';

            const day = document.getElementById("day").value;
            const date = document.getElementById("date").value;
            const amount = document.getElementById("amount").value;
            const category = document.getElementById("category").value;

            if (!day || !date || !amount || !category) {
                alert('Please fill all fields');
                isSubmitting = false;
                submitButton.disabled = false;
                submitButton.textContent = originalText;
                return;
            }

            console.log("Submitting expense:", { day, date, amount, category });
            // This would be your actual API call:
            // fetch('/api/expenses/', {
            //     method: 'POST',
            //     headers: {
            //         'Content-Type': 'application/json',
            //         'X-CSRFToken': getCookie('csrftoken'),
            //     },
            //     body: JSON.stringify({day, date, amount, category})
            // })
            // .then(response => {
            //     if (!response.ok) throw new Error('Failed to save expense');
            //     return response.json();
            // })
            // .then(() => {
            //     fetchExpenses();
            //     expenseForm.reset();
            //     document.getElementById("date").value = new Date().toISOString().split('T')[0];
            //     document.getElementById("amount").focus();
            // })
            
            // For demo, just add to the mock data and refetch
            setTimeout(() => {
                fetchExpenses();
                expenseForm.reset();
                document.getElementById("date").value = new Date().toISOString().split('T')[0];
                document.getElementById("amount").focus();
                
                isSubmitting = false;
                submitButton.disabled = false;
                submitButton.textContent = 'Add Expense';
            }, 1000);
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        window.downloadExcel = function() {
            console.log("Exporting to Excel...");
            // This would fetch your actual data:
            // fetch('/api/expenses/')
            //     .then(response => response.json())
            //     .then(expenses => {
            //         const worksheetData = [
            //             ["Day", "Date", "Amount (₹)", "Category"],
            //             ...expenses.map(expense => [
            //                 expense.day, 
            //                 formatDate(expense.date),
            //                 parseFloat(expense.amount).toFixed(2),
            //                 expense.category
            //             ])
            //         ];
                    
            //         const total = expenses.reduce((sum, exp) => sum + parseFloat(exp.amount), 0);
            //         worksheetData.push(["", "TOTAL", total.toFixed(2), ""]);
                    
            //         const workbook = XLSX.utils.book_new();
            //         const worksheet = XLSX.utils.aoa_to_sheet(worksheetData);
            //         XLSX.utils.book_append_sheet(workbook, worksheet, "Expenses");
            //         XLSX.writeFile(workbook, `Expenses_${new Date().toLocaleDateString().replace(/\//g, '-')}.xlsx`);
            //     });
            
            // For demo, just show an alert
            alert("In a real implementation, this would export your data to Excel");
        };
    });
    </script>
