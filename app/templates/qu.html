            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;

            background: #4a4a72;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;

        button {
            background: #007BFF;

            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;

        #submitBtn { background: #f39c12; }
        #nextBtn { background: #28a745; display: none; }
        #prevBtn { background: #6c757d; display: none; }
        #newQuizBtn { background: #17a2b8; display: none; }
        #timer { color: #f39c12; font-weight: bold; }
        #solution { 
            background: #2a2a3a;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
        #quizSummary {
            background: #2a2a3a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        #loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #09f;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .clock {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            color: white;
            background-color:  #1f314b;
            margin-left: 550px;
        }
        .nav-link i {
            margin-right: 8px;
        }
        .nav-link {
            color: #f9e8e8;
            transition: color 0.3s ease, background-color 0.3s ease;
        }
        .nav-link:hover {
            color: #007bff !important; /* Change color on hover */
        }
        .nav-link i {
            transition: transform 0.3s ease;
        }
        .nav-link:hover i {
            transform: scale(1.1); /* Slightly enlarge the icon on hover */
        }
        .nav-item.active .nav-link {
            color: #007bff; /* Highlight color for the active item */
            background-color: #f0f8ff; 
           
            font-weight: bold; /* Bold text for active item */
        }
        .fade-in {
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
        }

        /* Keyframes for fade-in */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Delayed fade-in for smoother experience */
        .fade-in-delay {
            animation-delay: 1s;
        }
        
    </style>
</head>

    <div class="quiz-container">
        <center>
        <h2 style="color:white">Daily Quiz</h2>
        </center>
        <div id="timer">Time Left: 05:00</div>
        <div id="progress">Question 1 of 10</div>
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading questions...</p>
        </div>
        <div id="quiz"></div>
        <div class="button-container">
            <button id="prevBtn" onclick="prevQuestion()">Previous</button>
            <button id="submitBtn" onclick="submitAnswer()">Submit</button>
            <button id="nextBtn" onclick="nextQuestion()">Next</button>
            <button id="newQuizBtn" onclick="startNewQuiz()">New Quiz</button>
        </div>
        <div id="result"></div>
        <div id="solution"></div>
        <div id="quizSummary"></div>
    </div>

    <script>
        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let timer;
        let timeLeft = 300;
        let userAnswers = [];
        let usedQuestionIds = new Set();

        const engineeringCategories = [
            { id: 17, name: "Science & Nature" },
            { id: 18, name: "Computers" },
            { id: 19, name: "Mathematics" },
            { id: 22, name: "Geography" },
            { id: 23, name: "History" },
            { id: 30, name: "Gadgets" }
        ];

        async function fetchEngineeringQuestions() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('quiz').style.display = 'none';

            try {
                const category = engineeringCategories[Math.floor(Math.random() * engineeringCategories.length)];
                const response = await fetch(`https://opentdb.com/api.php?amount=50&category=${category.id}&difficulty=medium&type=multiple`);
                const data = await response.json();

                if (data.response_code === 0) {
                    return data.results.map(q => ({
                        id: q.question,
                        text: decodeHtmlEntities(q.question),
                        options: shuffleArray([...q.incorrect_answers.map(decodeHtmlEntities), decodeHtmlEntities(q.correct_answer)]),
                        correct_answer: decodeHtmlEntities(q.correct_answer),
                    }));
                } else {
                    console.error("API Error:", data.response_code);
                    return [];
                }
            } catch (error) {
                console.error("Error fetching questions:", error);
                return [];
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quiz').style.display = 'block';
            }
        }

        function decodeHtmlEntities(text) {
            const textArea = document.createElement('textarea');
            textArea.innerHTML = text;
            return textArea.value;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function startNewQuiz() {
            currentQuestion = 0;
            score = 0;
            timeLeft = 300;
            userAnswers = [];
            usedQuestionIds = new Set();

            const allQuestions = await fetchEngineeringQuestions();
            if (allQuestions.length === 0) {
                alert("Failed to load questions. Please try again later.");
                return;
            }

            questions = [];
            while (questions.length < 10 && questions.length < allQuestions.length) {
                const randomIndex = Math.floor(Math.random() * allQuestions.length);
                const question = allQuestions[randomIndex];
                if (!usedQuestionIds.has(question.id)) {
                    questions.push(question);
                    usedQuestionIds.add(question.id);
                }
            }

            startTimer();
            displayQuestion();

            document.getElementById('newQuizBtn').style.display = 'none';
            document.getElementById('quizSummary').style.display = 'none';
            document.getElementById('progress').textContent = `Question 1 of ${questions.length}`;
        }

        function displayQuestion() {
            const q = questions[currentQuestion];
            let html = `<div class="question">${q.text}</div><div class="options">`;

            q.options.forEach((option, i) => {
                html += `<label><input type="radio" name="option" value="${option}"> ${option}</label>`;
            });

            html += `</div>`;
            document.getElementById('quiz').innerHTML = html;

            document.getElementById('prevBtn').style.display = currentQuestion > 0 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'block';

            document.getElementById('result').innerHTML = '';
            document.getElementById('solution').style.display = 'none';
            document.getElementById('solution').innerHTML = '';

            if (userAnswers[currentQuestion] !== undefined) {
                document.querySelector(`input[value="${userAnswers[currentQuestion]}"]`).checked = true;
            }
        }

        function submitAnswer() {
            const selected = document.querySelector('input[name="option"]:checked');
            if (!selected) {
                alert('Please select an answer');
                return;
            }

            const answer = selected.value;
            const q = questions[currentQuestion];

            userAnswers[currentQuestion] = answer;

            if (answer === q.correct_answer) {
                score++;
                document.getElementById('result').innerHTML = '<span class="correct">✓ Correct!</span>';
            } else {
                document.getElementById('result').innerHTML = '<span class="incorrect">✗ Incorrect</span>';
            }

            document.getElementById('solution').style.display = 'none';
            document.getElementById('solution').innerHTML = '';

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                displayQuestion();
                document.getElementById('progress').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            currentQuestion--;
            displayQuestion();
            document.getElementById('progress').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function startTimer() {
            clearInterval(timer);
            updateTimer();
            timer = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    finishQuiz();
                }
            }, 1000);
        }

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `Time Left: ${minutes}:${seconds}`;
        }

        function finishQuiz() {
            clearInterval(timer);

            const percentage = Math.round((score / questions.length) * 100);
            const timeUsed = 300 - timeLeft;
            const minutes = Math.floor(timeUsed / 60);
            const seconds = timeUsed % 60;

            let html = `<h3>Quiz Results</h3>
                <p>Score: ${score}/${questions.length} (${percentage}%)</p>
                <p>Time: ${minutes}m ${seconds}s</p>
                <h4>Review:</h4><ul>`;

            questions.forEach((q, i) => {
                const userAnswer = userAnswers[i] !== undefined ? userAnswers[i] : 'Not answered';
                const isCorrect = userAnswers[i] === q.correct_answer;

                html += `<li>
                    <strong>Q${i + 1}:</strong> ${q.text}<br>
                    <span class="${isCorrect ? 'correct' : 'incorrect'}">Your answer: ${userAnswer}</span><br>`;

                if (!isCorrect) {
                    html += `<strong>Correct answer:</strong> ${q.correct_answer}<br>`;
                }

                html += `</li>`;
            });

            html += `</ul>`;
            document.getElementById('quizSummary').innerHTML = html;
            document.getElementById('quizSummary').style.display = 'block';
            document.getElementById('quiz').innerHTML = '';
            document.getElementById('newQuizBtn').style.display = 'block';
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        window.onload = startNewQuiz;
    </script>
</body>
