<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Tracker | E-Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #1e1e2f;
            --card-bg: #2a2d3e;
            --text-color: #f8f9fa;
            --highlight: #ff5e62;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }
        
        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .exam-card {
            background: var(--card-bg);
            border-radius: 12px;
            border-left: 5px solid;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: 100%;
        }
        
        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        
        .priority-high { border-color: var(--danger); }
        .priority-medium { border-color: var(--warning); }
        .priority-low { border-color: var(--success); }
        
        .progress {
            height: 8px;
            background-color: #3a3f58;
            border-radius: 4px;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #ff9966, #ff5e62);
            border-radius: 4px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            border: none;
            font-weight: 500;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #ff8a5c, #e04e52);
        }
        
        .subject-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background-color: #3a3f58;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        
        .modal-content {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
        }
        
        .form-control, .form-select {
            background-color: #3a3f58;
            border: 1px solid #495057;
            color: var(--text-color);
        }
        
        .form-control:focus, .form-select:focus {
            background-color: #3a3f58;
            color: var(--text-color);
            border-color: #ff9966;
            box-shadow: 0 0 0 0.25rem rgba(255, 153, 102, 0.25);
        }
        
        .days-badge {
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            .exam-card {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Your existing navbar/sidebar goes here -->

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0"><i class="fas fa-book-open me-2"></i>Exam Tracker</h2>
                <p class="text-muted mb-0">Track all your upcoming exams in one place</p>
            </div>
            <button class="btn btn-primary px-4" data-bs-toggle="modal" data-bs-target="#addExamModal">
                <i class="fas fa-plus me-2"></i>Add Exam
            </button>
        </div>

        <!-- Filter/Search Bar -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-dark text-white">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" class="form-control" placeholder="Search exams..." id="searchExams">
                </div>
            </div>
            <div class="col-md-6 mt-2 mt-md-0">
                <select class="form-select" id="filterPriority">
                    <option value="all">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
            </div>
        </div>

        <!-- Exams Grid -->
        <div class="row g-4" id="exams-container">
            <!-- Exams will be loaded here dynamically -->
        </div>

        <!-- Empty State -->
        <div class="text-center py-5" id="empty-state" style="display: none;">
            <i class="fas fa-book fa-3x mb-3 text-muted"></i>
            <h4 class="text-muted">No exams found</h4>
            <p class="text-muted">Add your first exam to get started</p>
            <button class="btn btn-primary px-4" data-bs-toggle="modal" data-bs-target="#addExamModal">
                <i class="fas fa-plus me-2"></i>Add Exam
            </button>
        </div>
    </div>

    <!-- Add Exam Modal -->
    <div class="modal fade" id="addExamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Add New Exam</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="exam-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Exam Name*</label>
                                <input type="text" class="form-control" placeholder="e.g. Mathematics Final" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Priority*</label>
                                <select class="form-select" required>
                                    <option value="">Select priority</option>
                                    <option value="high">High</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date*</label>
                                <input type="date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Time</label>
                                <input type="time" class="form-control">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Subjects</label>
                            <div class="d-flex flex-wrap gap-2" id="subject-tags-container">
                                <!-- Subject tags will appear here -->
                            </div>
                            <div class="input-group mt-2">
                                <input type="text" class="form-control" placeholder="Add subject" id="subject-input">
                                <button class="btn btn-outline-secondary" type="button" id="add-subject-btn">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" rows="3" placeholder="Exam details, syllabus, etc."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-exam-btn">Save Exam</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample Data - Replace with your actual data
        let exams = [
            {
                id: 1,
                name: "Mathematics Final",
                date: "2023-12-15",
                time: "09:00",
                priority: "high",
                progress: 45,
                subjects: ["Algebra", "Calculus", "Geometry"],
                notes: "Chapters 1-10, focus on integration"
            },
            {
                id: 2,
                name: "Physics Midterm",
                date: "2023-11-20",
                priority: "medium",
                progress: 30,
                subjects: ["Mechanics", "Thermodynamics"],
                notes: "Newton's laws and energy conservation"
            },
            {
                id: 3,
                name: "History Presentation",
                date: "2023-11-05",
                priority: "low",
                progress: 80,
                subjects: ["World War II"],
                notes: "Prepare 15 minute presentation"
            }
        ];

        // DOM Elements
        const examsContainer = document.getElementById('exams-container');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('searchExams');
        const priorityFilter = document.getElementById('filterPriority');
        const subjectInput = document.getElementById('subject-input');
        const addSubjectBtn = document.getElementById('add-subject-btn');
        const subjectTagsContainer = document.getElementById('subject-tags-container');
        const saveExamBtn = document.getElementById('save-exam-btn');

        // Current subjects for new exam
        let currentSubjects = [];

        // Render Exams
        function renderExams(examsToRender = exams) {
            examsContainer.innerHTML = '';
            
            if (examsToRender.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            examsToRender.forEach(exam => {
                const daysLeft = calculateDaysLeft(exam.date);
                const priorityClass = `priority-${exam.priority}`;
                const priorityBadgeClass = exam.priority === 'high' ? 'bg-danger' : 
                                         exam.priority === 'medium' ? 'bg-warning' : 'bg-success';
                
                examsContainer.innerHTML += `
                    <div class="col-md-6 col-lg-4">
                        <div class="exam-card p-3 h-100 ${priorityClass}">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="mb-1">${exam.name}</h5>
                                <span class="badge ${priorityBadgeClass} rounded-pill">
                                    ${exam.priority.charAt(0).toUpperCase() + exam.priority.slice(1)}
                                </span>
                            </div>
                            
                            <div class="my-2">
                                ${exam.subjects.map(subject => 
                                    `<span class="subject-tag">${subject}</span>`
                                ).join('')}
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <div>
                                    <small class="text-muted">
                                        <i class="far fa-calendar me-1"></i>
                                        ${formatDate(exam.date)} ${exam.time ? '• ' + formatTime(exam.time) : ''}
                                    </small>
                                </div>
                                <div>
                                    <span class="badge bg-dark days-badge">
                                        ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} left
                                    </span>
                                </div>
                            </div>
                            
                            <div class="mt-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <small>Preparation Progress</small>
                                    <small>${exam.progress}%</small>
                                </div>
                                <div class="progress">
                                    <div class="progress-bar" style="width: ${exam.progress}%"></div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-3">
                                <a href="/study-plan/${exam.id}" class="btn btn-sm btn-outline-light">
                                    <i class="fas fa-tasks me-1"></i> Study Plan
                                </a>
                                <div>
                                    <button class="btn btn-sm btn-outline-info me-2" onclick="editExam(${exam.id})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteExam(${exam.id})">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Helper Functions
        function calculateDaysLeft(dateString) {
            const today = new Date();
            const examDate = new Date(dateString);
            const diffTime = examDate - today;
            return Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function formatTime(timeString) {
            return new Date(`2000-01-01T${timeString}`).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Filter/Search Functions
        function filterExams() {
            const searchTerm = searchInput.value.toLowerCase();
            const priorityValue = priorityFilter.value;
            
            const filteredExams = exams.filter(exam => {
                const matchesSearch = exam.name.toLowerCase().includes(searchTerm) || 
                                    exam.subjects.some(sub => sub.toLowerCase().includes(searchTerm));
                const matchesPriority = priorityValue === 'all' || exam.priority === priorityValue;
                return matchesSearch && matchesPriority;
            });
            
            renderExams(filteredExams);
        }

        // Subject Tag Management
        function addSubjectTag(subject) {
            if (!subject.trim()) return;
            
            currentSubjects.push(subject.trim());
            updateSubjectTags();
            subjectInput.value = '';
        }

        function updateSubjectTags() {
            subjectTagsContainer.innerHTML = '';
            currentSubjects.forEach((subject, index) => {
                const tag = document.createElement('span');
                tag.className = 'subject-tag me-2 mb-2';
                tag.innerHTML = `
                    ${subject}
                    <button class="btn-remove-subject ms-2" data-index="${index}">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                subjectTagsContainer.appendChild(tag);
            });
            
            // Add event listeners to remove buttons
            document.querySelectorAll('.btn-remove-subject').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    currentSubjects.splice(index, 1);
                    updateSubjectTags();
                });
            });
        }

        // Event Listeners
        searchInput.addEventListener('input', filterExams);
        priorityFilter.addEventListener('change', filterExams);
        
        addSubjectBtn.addEventListener('click', () => {
            addSubjectTag(subjectInput.value);
        });
        
        subjectInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSubjectTag(subjectInput.value);
            }
        });

        saveExamBtn.addEventListener('click', () => {
            // In a real app, you would save to your backend here
            alert('Exam saved successfully!');
            $('#addExamModal').modal('hide');
            
            // For demo purposes, add to local array
            const newExam = {
                id: exams.length + 1,
                name: document.querySelector('#exam-form input[type="text"]').value,
                date: document.querySelector('#exam-form input[type="date"]').value,
                time: document.querySelector('#exam-form input[type="time"]').value,
                priority: document.querySelector('#exam-form select').value,
                progress: 0,
                subjects: [...currentSubjects],
                notes: document.querySelector('#exam-form textarea').value
            };
            
            exams.push(newExam);
            renderExams();
            currentSubjects = [];
            updateSubjectTags();
            document.getElementById('exam-form').reset();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderExams();
            
            // Initialize modal date picker with today's date
            const today = new Date().toISOString().split('T')[0];
            document.querySelector('#exam-form input[type="date"]').value = today;
            document.querySelector('#exam-form input[type="date"]').min = today;
        });

        // Example functions - implement your actual logic
        function editExam(id) {
            alert(`Edit exam ${id} - implement your edit logic`);
        }

        function deleteExam(id) {
            if (confirm('Are you sure you want to delete this exam?')) {
                exams = exams.filter(exam => exam.id !== id);
                renderExams();
            }
        }
    </script>
</body>
</html>
