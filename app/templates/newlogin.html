<html>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>   
<head>
<title>Login - Engineer's Daily Planner</title>
<style>
    body {
        background-image: url("not.jpg"); 
        background-repeat: no-repeat; 
        background-position: center;
        background-size: cover;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    #div {
        width: 300px;
        height: auto;
        min-height: 400px;
        background-color: rgba(234, 229, 229, 0.9);
        margin: 70px auto; /* Changed to auto for centering */
        border: 2px solid black;
        border-radius: 0px 35px;
        padding: 20px;
        box-sizing: border-box;
        text-align: center; /* Center align all content */
    }
    #img1 {
        width: 100px;
        height: 100px;
        display: block;
        margin: -40px auto 20px auto; /* Centered logo */
    }
    h2 {
        margin: 0 0 20px 0;
        text-align: center;
        color: #333;
    }
    #input {
        width: 80%;
        padding: 10px;
        margin: 10px auto; /* Centered inputs */
        display: block;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    #btn {
        width: 85%;
        padding: 10px;
        margin: 20px auto; /* Centered button */
        display: block;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    #btn:hover {
        background-color: #45a049;
    }
    .alert-error {
        color: red;
        text-align: center;
        padding: 5px;
        margin: 10px 0;
    }
    .alert-success {
        color: green;
        text-align: center;
        padding: 5px;
        margin: 10px 0;
    }
    .signup-link {
        text-align: center;
        margin-top: 15px;
    }
    .signup-link a {
        color: #007bff;
        text-decoration: none;
    }
    .signup-link a:hover {
        text-decoration: underline;
    }
    .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(8, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 1s ease;  
    }
    .splash-screen h1 {
        color: #f7efef;
        font-size: 60px;
        font-weight: bold;
    }
    .hide-splash {
        opacity: 0;
        visibility: hidden;
    }
</style>
</head>

<body>
    {% include 'navbar.html' %}
    
    <div id="div">
        {% if messages %}
            {% for message in messages %}
                <div class="alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <img src="/static/logo.png" id="img1" alt="App Logo">
            <h2>Login Window</h2>
            <input type="email" name="email" placeholder="Enter Email" id="input" required>
            <input type="password" name="pass" placeholder="Enter Password" id="input" required>
            <input type="submit" value="Login" id="btn">
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>

    <div class="splash-screen" id="splashScreen">
        <h1>Engineer's Daily Planner</h1>
    </div>

    <script>
        window.onload = function() {
            if (!sessionStorage.getItem("splashShown")) {
                setTimeout(function() {
                    document.getElementById("splashScreen").classList.add("hide-splash");
                    sessionStorage.setItem("splashShown", "true");
                }, 2000);
            } else {
                document.getElementById("splashScreen").classList.add("hide-splash");
            }
        };
    </script>
</body>
</html>
