<head>
<title>My Web Page</title>
<style>
	body{

		background-position: center;
		background-size: cover;
	}
	#div{
		width: 300px;
		height: 400px;
		background-color: rgb(234, 229, 229);
	    margin-left:400px;
		margin-top:70px;
		border:2px solid black;
		opacity: 0.8;
		border-radius: 35px 10px;
        margin: 70px auto;
	}
	#img1{
		width: 100px;
		height: 100px;
		margin-left: 100px;
		margin-top: -40px;
		border-radius: 50%;
	}
	h2{
		margin-left: 80px;
		margin-top: 5px;
	}
	#input{
		margin-left: 50px;
		margin-top: 10px;
		padding: 10px;
	}
	#btn{
		margin-left: 110px;
		margin-top: 10px;
		padding: 10px;
	}
	#btn:hover{
		background-color: black;
		color:white;
	}

</style>
</head>
<body>
{% include 'navbar.html' %}
<div id="div">
	<form action="" method="post">
	{% csrf_token %}
	<img src="/static/signuplogo.jpg" id="img1">
	<h2>SignUp Window</h2>
	<input type="text" name="name" placeholder="Enter Name" id="input" required>
	<input type="text" name="mob" placeholder="Enter Mobile" id="input"required>
	<input type="email" name="email" placeholder="Enter Email" id="input"required>
	<input type="password" name="pass" placeholder="Create Password" id="input"required><br><br>
	<input type="submit" value="SingUp" id="btn">
	</form>
</div>
</body>
