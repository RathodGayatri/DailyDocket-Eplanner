    <div class="container">
        <h2 class="text-center my-4" style="color:white">Daily Expenditure Tracker</h2>
        <form id="expense-form" class="mb-4">
            <div class="row">
                <div class="col-md-3">
                    <label for="day"style="color:white">Select Day</label>
                    <select class="form-control" id="day" required>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="amount" style="color:white">Amount</label>
                    <input type="number" class="form-control" id="amount" step="0.01" required>
                </div>
                <div class="col-md-3">
                    <label for="category"style="color:white">Spending Type</label>
                    <select class="form-control" id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Stationary</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                </div>
            </div>
        </form>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Day</th>
                    <th>Amount</th>
                    <th>Spending Type</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expense-list">
                <!-- Dynamic Content -->
            </tbody>
        </table>

        <h5 class="mt-3"style="color:white">Weekly Total: ₹<span id="weekly-total">0</span></h5>
        <h5 class="mt-3"style="color:white">Monthly Total: ₹<span id="monthly-total">0</span></h5>
        <button class="btn btn-success mt-2" onclick="downloadExcel()">Download as Excel</button>
    </div>

    <script>
document.addEventListener("DOMContentLoaded", () => {
    const expenseForm = document.getElementById("expense-form");
    const expenseList = document.getElementById("expense-list");
    const weeklyTotalDisplay = document.getElementById("weekly-total");
    const monthlyTotalDisplay = document.getElementById("monthly-total");
    let isSubmitting = false;

    // Load expenses when page loads
    fetchExpenses();

    function fetchExpenses() {
        fetch('/api/expenses/')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(expenses => {
                renderExpenses(expenses);
            })
            .catch(error => {
                console.error('Error fetching expenses:', error);
            });
    }

    function renderExpenses(expenses) {
        expenseList.innerHTML = "";
        let weeklyTotal = 0;
        let monthlyTotal = 0;

        expenses.forEach((expense) => {
            const amount = parseFloat(expense.amount);
            weeklyTotal += amount;
            monthlyTotal += amount;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${expense.day}</td>
                <td>₹${amount.toFixed(2)}</td>
                <td>${expense.category}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteExpense(${expense.id})">
                        Delete
                    </button>
                </td>
            `;
            expenseList.appendChild(row);
        });

        weeklyTotalDisplay.textContent = weeklyTotal.toFixed(2);
        monthlyTotalDisplay.textContent = monthlyTotal.toFixed(2);
    }

    window.deleteExpense = (id) => {
        if (confirm('Are you sure you want to delete this expense?')) {
            fetch(`/api/expenses/${id}/`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                }
            })
            .then(response => {
                if (response.ok) fetchExpenses();
            });
        }
    };

    if (expenseForm && !expenseForm.hasAttribute('data-listener-attached')) {
        expenseForm.setAttribute('data-listener-attached', 'true');
        expenseForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            
            isSubmitting = true;
            const submitButton = e.target.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Saving...';

            const day = document.getElementById("day").value;
            const amount = parseFloat(document.getElementById("amount").value);
            const category = document.getElementById("category").value;

            if (!day || !amount || !category) {
                alert('Please fill all fields');
                isSubmitting = false;
                submitButton.disabled = false;
                submitButton.textContent = originalText;
                return;
            }

            fetch('/api/expenses/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({day, amount, category})
            })
            .then(response => {
                if (!response.ok) throw new Error('Failed to save expense');
                return response.json();
            })
            .then(() => {
                fetchExpenses();
                expenseForm.reset();
                document.getElementById("amount").focus();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error saving expense. Please try again.');
            })
            .finally(() => {
                isSubmitting = false;
                submitButton.disabled = false;
                submitButton.textContent = 'Add Expense';
            });
        });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    window.downloadExcel = function() {
        fetch('/api/expenses/')
            .then(response => response.json())
            .then(expenses => {
                const worksheetData = [
                    ["Day", "Amount (₹)", "Category"],
                    ...expenses.map(expense => [
                        expense.day, 
                        parseFloat(expense.amount).toFixed(2),
                        expense.category
                    ])
                ];
                
                const total = expenses.reduce((sum, exp) => sum + parseFloat(exp.amount), 0);
                worksheetData.push(["", "TOTAL", total.toFixed(2)]);
                
                const workbook = XLSX.utils.book_new();
                const worksheet = XLSX.utils.aoa_to_sheet(worksheetData);
                XLSX.utils.book_append_sheet(workbook, worksheet, "Expenses");
                XLSX.writeFile(workbook, `Expenses_${new Date().toLocaleDateString().replace(/\//g, '-')}.xlsx`);
            })
            .catch(error => {
                console.error('Export error:', error);
                alert('Failed to export. Please try again.');
            });
    };
});     
    </script>

           
<script>
    // Auto-start tracking on page load
    document.addEventListener('DOMContentLoaded', function() {
        const trackers = document.querySelectorAll('.time-tracker');
        let startTime = new Date();  // Global start time
    
        // Update time every second (frontend display)
        setInterval(() => {
            const currentTime = new Date();
            const elapsedSeconds = Math.floor((currentTime - startTime) / 1000);
            
            trackers.forEach(tracker => {
                const taskName = tracker.dataset.task;
                const savedTime = parseInt(localStorage.getItem(`time_${taskName}`)) || 0;
                const totalSeconds = savedTime + elapsedSeconds;
                
                // Update display
                tracker.querySelector('.time-display').textContent = formatTime(totalSeconds);
            });
        }, 1000);
    
        // Save time to backend when page closes
        window.addEventListener('beforeunload', () => {
            const endTime = new Date();
            const elapsedSeconds = Math.floor((endTime - startTime) / 1000);
            
            trackers.forEach(tracker => {
                const taskName = tracker.dataset.task;
                const savedTime = parseInt(localStorage.getItem(`time_${taskName}`)) || 0;
                const totalSeconds = savedTime + elapsedSeconds;
                
                // Send to backend
                fetch('/update_time_log/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({
                        task_name: taskName,
                        duration_seconds: totalSeconds,
                    }),
                });
            });
        });
    });
    
    function formatTime(seconds) {
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        return `${hrs}h ${mins}m ${secs}s`;
    }
    </script>
